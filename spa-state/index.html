  <link rel="stylesheet" href="/spa/assets/style.css">
  <style>
    /* Tabs are <button>s here (the URL never changes), not links. */
    .site-nav button {
      padding: 4px 0;
      border-radius: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #fff;
    }
    .site-nav button[aria-current="page"] { border-bottom-color: #f7c948; }
    .brand { color: #fff; font-weight: 700; }

    .screen-wizard .hero { background: #7b4fd1; }
    .wizard-steps { margin: 0 0 12px; font-size: 0.9rem; opacity: 0.9; }
    .wizard-plans { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .wizard-plans button[aria-pressed="true"] { background: #f7c948; font-weight: 700; }
    .wizard-nav { display: flex; gap: 8px; margin-top: 16px; }
    .wizard-field { display: block; margin-bottom: 8px; }
    .wizard-field input {
      display: block;
      margin-top: 4px;
      padding: 8px 10px;
      font: inherit;
      border: 0;
      border-radius: 6px;
      min-width: 240px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(16, 24, 32, 0.6);
      z-index: 1000;
    }
    .modal {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      background: #fff;
      color: #1f2933;
      border-radius: 8px;
    }
    .modal h2 { margin: 0 0 12px; }
    .modal table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    .modal th, .modal td { padding: 6px 4px; border-bottom: 1px solid #e4e7eb; text-align: left; }
    .modal button { background: #1f2933; color: #fff; }
  </style>
